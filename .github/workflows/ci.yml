name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Setup Environment
      run: npm run setup
      
    - name: Run Linter
      run: npm run lint
      
    - name: Run Tests
      run: npm run test

    - name: Verify Build
      run: npm run build
